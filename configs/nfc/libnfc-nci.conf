###############################################################################
# Android NFC stack configuration for the PN553 controller used by hinoki.

NFC_DEBUG_ENABLED=0

# Keep the stack state in the directory created and labelled by the platform.
NFA_STORAGE="/data/nfc"
PRESERVE_STORAGE=0x01

# Put the controller to sleep with the display to avoid needless battery drain.
SCREEN_OFF_POWER_STATE=0

# Start with passive NFC-A tags. The Oreo PN553 HAL hangs when Android 10 asks
# it to start one combined discovery cycle containing the legacy proprietary
# B-prime/Kovio modes. Active-mode P2P is also intentionally omitted: Android
# Beam was removed from Android 10 and that path is not stable on this port.
POLLING_TECH_MASK=0x01
P2P_LISTEN_TECH_MASK=0x00

# This device has no usable embedded secure element on the AOSP NFC stack.
NFA_MAX_EE_SUPPORTED=0x00

AID_MATCHING_MODE=0x01
